<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✅ Doit — Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>📋 Do<span>it</span></h1>
      <p id="date-label"></p>
    </div>
    <div class="stats-badge">
      <span id="streak-label">🔥 0 done</span>
    </div>
  </header>

  <div class="progress-card">
    <div class="progress-top">
      <span class="progress-label" id="progress-label">✨ 0 of 0 completed</span>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="task-input" placeholder="🖊️  What needs to be done?" maxlength="120" />
    <select id="cat-select">
      <option value="Work">💼 Work</option>
      <option value="Personal">🧘 Personal</option>
      <option value="Shopping">🛒 Shopping</option>
      <option value="Health">💪 Health</option>
      <option value="Other">📌 Other</option>
    </select>
    <button class="add-btn" id="add-btn">➕ Add</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">🗂️ All</button>
    <button class="filter-btn" data-filter="active">⏳ Active</button>
    <button class="filter-btn" data-filter="done">✅ Done</button>
    <button class="filter-btn" data-filter="Work">💼 Work</button>
    <button class="filter-btn" data-filter="Personal">🧘 Personal</button>
    <button class="filter-btn" data-filter="Shopping">🛒 Shopping<span>time to do</span></button>
    <button class="filter-btn" data-filter="Health">💪 Health</button>
  </div>

  <div id="task-list"></div>

  <div class="empty" id="empty-state">
    <div class="empty-icon">🌿</div>
    <h3>All clear!</h3>
    <p>No tasks here. Add one above to get started.</p>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
